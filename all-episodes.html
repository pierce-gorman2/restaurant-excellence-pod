<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Episodes | Restaurant Excellence</title>
    <meta
      name="description"
      content="Browse all Restaurant Excellence podcast episodes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="container nav">
          <a href="index.html" class="brand" aria-label="Restaurant Excellence home">
            <span class="brand-text">
              <span class="brand-restaurant">Restaurant</span>
              <span class="brand-excellence-wrap brand-excellence-inline">
                <span class="brand-excellence">Excellence</span>
                <span class="brand-arrow" aria-hidden="true"></span>
              </span>
            </span>
          </a>

          <nav class="nav-links" aria-label="Primary">
            <a href="index.html">Home</a>
            <a href="contact.html">Contact</a>
          </nav>
        </div>
      </header>

      <main>
        <section class="section episodes-page">
          <div class="container">
            <div class="section-heading section-heading-row">
              <div>
                <p class="eyebrow">Library</p>
                <h1 class="page-title">All Episodes</h1>
              </div>

              <div class="filter-bar" aria-label="Episode filters">
                <button class="filter-button active" data-filter="all">All Episodes</button>
                <button class="filter-button" data-filter="Operations">Operations</button>
                <button class="filter-button" data-filter="Interviews">Interviews</button>
                <button class="filter-button" data-filter="Vision &amp; Mission">
                  Vision &amp; Mission
                </button>
                <button class="filter-button" data-filter="Culture">Culture</button>
                <button class="filter-button" data-filter="Training">Training</button>
              </div>
            </div>

            <div class="coming-soon-panel coming-soon-panel-wide" aria-label="Episodes coming soon">
              <p>Episodes coming Q3 of 2026</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container footer-row">
          <div>
            <strong>Restaurant Excellence</strong>
            <p>Helping restaurant operators operate with excellence</p>
          </div>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
